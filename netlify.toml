[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/summary"
  to = "/.netlify/functions/summary"
  status = 200

[[redirects]]
  from = "/api/transactions"
  to = "/.netlify/functions/transactions"
  status = 200

[[redirects]]
  from = "/api/link"
  to = "/.netlify/functions/link"
  status = 200

[[redirects]]
  from = "/api/classify"
  to = "/.netlify/functions/classify"
  status = 200

[[redirects]]
  from = "/api/receipt"
  to = "/.netlify/functions/receipt"
  status = 200

[[redirects]]
  from = "/webhook"
  to = "/.netlify/functions/webhook"
  status = 200

[functions."reminder-cron"]
  schedule = "0 17 * * *"
