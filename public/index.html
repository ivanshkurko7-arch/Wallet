<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wallet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0d1a;
    --text: #ffffff;
    --hint: #8a8fa8;
    --card: rgba(255,255,255,0.05);
    --purple: #7c5cff;
    --pink: #ff5ea8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 14px 14px 100px;
  }

  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .topbar .icon-btn {
    width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center; font-size: 16px; border: none; color: white;
  }
  .topbar .title { font-size: 17px; font-weight: 800; }

  .balance-card {
    background: radial-gradient(circle at 100% 0%, #3d2e8c 0%, transparent 55%),
                linear-gradient(160deg, #1c1440 0%, #2a1a52 45%, #3c1740 100%);
    background-size: cover; background-position: center;
    border-radius: 22px; padding: 20px; margin-bottom: 12px; position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06); min-height: 150px;
  }
  .balance-card .house { position: absolute; right: 8px; top: 8px; width: 92px; height: 92px; opacity: 0.95; }
  .balance-label { font-size: 12px; color: var(--hint); display:flex; align-items:center; gap:5px; }
  .balance { font-size: 32px; font-weight: 800; margin: 6px 0 4px; letter-spacing: -0.5px; text-shadow: 0 1px 6px rgba(0,0,0,0.4); }
  .balance-delta { font-size: 12px; color: #bff2d2; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.4); }

  .bg-edit-btn {
    position: absolute; right: 10px; bottom: 10px; width: 32px; height: 32px; border-radius: 10px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 14px;
  }
  .bg-reset-btn {
    position: absolute; right: 48px; bottom: 10px; width: 32px; height: 32px; border-radius: 10px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 13px; display: none;
  }

  .avatar-row { display:flex; align-items:center; margin-top: 16px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    font-size: 13px; font-weight: 700; color: white; border: 2px solid #241a4a; margin-right: -10px;
    background: linear-gradient(135deg, var(--purple), var(--pink)); flex-shrink: 0;
  }
  .avatar.add { background: rgba(255,255,255,0.18); border-style: dashed; font-size: 16px; }

  .action-row { display:flex; gap: 8px; margin-bottom: 12px; }
  .action-btn {
    flex: 1; background: var(--card); border-radius: 16px; padding: 12px 6px; text-align: center;
    border: none; color: white; font-family: inherit; cursor: pointer;
  }
  .action-btn .ic { font-size: 18px; margin-bottom: 5px; }
  .action-btn .lb { font-size: 10.5px; color: var(--hint); }

  .section-card {
    background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px;
    border: none; width: 100%; text-align: left; color: white; font-family: inherit; display: block;
  }
  .section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; }
  .section-head .h { font-size: 14.5px; font-weight: 700; }
  .section-head .more { font-size: 11.5px; color: var(--hint); }

  .donut-wrap { display:flex; align-items:center; gap: 16px; }
  .donut-legend { flex:1; min-width:0; }
  .leg-row { display:flex; align-items:center; gap: 8px; padding: 6px 0; font-size: 12.5px; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .leg-name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  .leg-pct { color: var(--hint); font-size: 11px; width: 30px; text-align:right; }
  .leg-amt { font-weight: 600; width: 62px; text-align:right; font-size: 12px; }

  .member-list { display:flex; flex-direction:column; gap: 10px; }
  .member-row { display:flex; align-items:center; gap: 10px; }
  .member-row .m-info { flex: 1; min-width: 0; }
  .member-row .m-name { font-size: 13px; font-weight: 600; }
  .member-row .m-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 5px; overflow:hidden; }
  .member-row .m-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--purple), var(--pink)); }
  .member-row .m-amt { font-size: 13px; font-weight: 700; }
  .member-row .m-pct { font-size: 10.5px; color: var(--hint); text-align:right; }

  .storage-row { display:flex; align-items:center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .storage-row:last-child { border-bottom: none; }
  .storage-icon { width: 34px; height: 34px; border-radius: 11px; background: rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .storage-name { flex:1; font-size: 13px; }
  .storage-bal { font-weight: 700; font-size: 13.5px; }
  .storage-bal.negative { color: #ff6b81; }
  .storage-bal.positive { color: #5be08a; }

  .tx-row { display:flex; align-items:center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .tx-row:last-child { border-bottom: none; }
  .tx-icon { width: 38px; height: 38px; border-radius: 12px; display:flex; align-items:center; justify-content:center; font-size: 16px; flex-shrink:0; background: rgba(255,255,255,0.06); }
  .tx-info { flex:1; min-width:0; }
  .tx-cat { font-size: 13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx-meta { font-size: 11px; color: var(--hint); margin-top: 1px; }
  .tx-amt { font-weight: 700; font-size: 13.5px; white-space:nowrap; }
  .tx-amt.expense { color: #ff6b81; }
  .tx-amt.income { color: #5be08a; }
  .tx-del { background:none; border:none; color: var(--hint); font-size: 15px; padding: 4px; opacity: 0.55; }

  .invite-row { display:flex; align-items:center; justify-content:space-between; font-size: 12.5px; color: var(--hint); }
  .invite-row code { background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 8px; color: white; font-size: 13px; }

  .empty { color: var(--hint); font-size: 13px; padding: 4px 0; }

  .bottom-nav {
    position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 8;
    background: rgba(20,16,40,0.92); backdrop-filter: blur(10px);
    border-radius: 22px; padding: 8px 6px; display:flex; align-items:center; justify-content:space-around;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .nav-item { background:none; border:none; color: var(--hint); font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:3px; font-size: 9.5px; padding: 4px 6px; }
  .nav-item.active { color: white; }
  .nav-item .ic { font-size: 18px; }
  .nav-fab {
    width: 46px; height: 46px; border-radius: 50%; border:none; margin-top: -22px;
    background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; font-size: 22px;
    display:flex; align-items:center; justify-content:center;
  }

  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: flex-end; z-index: 20; }
  .sheet-overlay.open { display: flex; }
  .sheet { background: #14102a; width: 100%; border-radius: 22px 22px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 4px; }
  .sheet h2 { font-size: 17px; }
  .sheet-close { background: rgba(255,255,255,0.08); border: none; color: white; width: 30px; height: 30px; border-radius: 10px; font-size: 14px; }

  .type-toggle { display:flex; gap: 8px; margin: 14px 0; }
  .type-btn { flex:1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: white; font-size: 13.5px; font-weight:600; text-align:center; }
  .type-btn.sel-expense { background: #ff6b81; border-color: #ff6b81; color: #400; }
  .type-btn.sel-income { background: #5be08a; border-color: #5be08a; color: #043; }
  .sheet label { font-size: 11.5px; color: var(--hint); display:block; margin: 12px 0 6px; }
  .sheet input { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: white; font-size: 16px; }
  .chip-group { display:flex; flex-wrap:wrap; gap: 7px; }
  .chip-btn { padding: 7px 13px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: white; font-size: 12.5px; }
  .chip-btn.selected { background: var(--purple); border-color: var(--purple); }
  .submit-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; margin-top: 18px; background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; font-size: 15px; font-weight: 700; }
  .submit-btn:disabled { opacity: 0.5; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 25; padding: 40px 14px 14px; }
  .modal-overlay.open { display: block; }
  .modal-box { background: #14102a; border-radius: 20px; padding: 18px; max-height: calc(100vh - 60px); overflow-y: auto; border: 1px solid rgba(255,255,255,0.08); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .modal-head h2 { font-size: 17px; }
  .modal-close { background: rgba(255,255,255,0.08); border: none; color: white; width: 32px; height: 32px; border-radius: 10px; font-size: 15px; }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" onclick="showInvite()">☰</button>
  <div class="title">Wallet</div>
  <button class="icon-btn" onclick="loadData()">↻</button>
</div>

<div class="balance-card" id="balanceCard">
  <svg class="house" id="houseIcon" viewBox="0 0 100 100" fill="none">
    <path d="M50 15 L88 45 L82 45 L82 85 L18 85 L18 45 L12 45 Z" fill="#ffffff" opacity="0.10"/>
    <circle cx="50" cy="55" r="10" fill="#ff5ea8" opacity="0.55"/>
  </svg>
  <div class="balance-label">👁 Общий баланс</div>
  <div class="balance" id="balance">—</div>
  <div class="balance-delta" id="balanceSub"></div>
  <div class="avatar-row" id="avatarRow"></div>
  <button class="bg-reset-btn" id="bgResetBtn" onclick="resetBackground(event)">✕</button>
  <button class="bg-edit-btn" onclick="pickBackground(event)">🖼</button>
</div>
<input type="file" id="bgFileInput" accept="image/*" style="display:none">

<div class="action-row">
  <button class="action-btn" onclick="openSheet('expense')"><div class="ic">➕</div><div class="lb">Добавить</div></button>
  <button class="action-btn" onclick="showInvite()"><div class="ic">🔗</div><div class="lb">Пригласить</div></button>
  <button class="action-btn" onclick="openModal('storage')"><div class="ic">🏦</div><div class="lb">Хранение</div></button>
  <button class="action-btn" onclick="openModal('tx')"><div class="ic">📋</div><div class="lb">История</div></button>
</div>

<button class="section-card" onclick="openModal('analytics')">
  <div class="section-head"><div class="h">Расходы по категориям</div><div class="more">Подробнее ></div></div>
  <div class="donut-wrap">
    <svg id="donutSvg" width="108" height="108" viewBox="0 0 108 108"></svg>
    <div class="donut-legend" id="categories"></div>
  </div>
</button>

<button class="section-card" onclick="openModal('family')">
  <div class="section-head"><div class="h">Кто сколько потратил</div><div class="more">Подробнее ></div></div>
  <div class="member-list" id="members"></div>
</button>

<button class="section-card" onclick="openModal('storage')">
  <div class="section-head"><div class="h">Где хранятся деньги</div><div class="more">Подробнее ></div></div>
  <div id="storagePreview"></div>
</button>

<button class="section-card" onclick="openModal('tx')">
  <div class="section-head"><div class="h">Последние операции</div><div class="more">Все ></div></div>
  <div id="transactionsPreview"></div>
</button>

<div class="section-card">
  <div class="invite-row">
    <span>Код приглашения партнёра</span>
    <code id="inviteCode">—</code>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-item active" id="navHome" onclick="closeModal()"><div class="ic">🏠</div>Главная</button>
  <button class="nav-item" onclick="openModal('tx')"><div class="ic">📋</div>Операции</button>
  <button class="nav-fab" onclick="openSheet('expense')">+</button>
  <button class="nav-item" onclick="openModal('analytics')"><div class="ic">📊</div>Аналитика</button>
  <button class="nav-item" onclick="openModal('family')"><div class="ic">👥</div>Семья</button>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeOnModalOverlay(event)">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">—</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"><div class="empty">Загрузка…</div></div>
  </div>
</div>

<div class="sheet-overlay" id="overlay" onclick="closeOnOverlay(event)">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="sheetTitle">Новая операция</h2>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <div class="type-toggle">
      <div class="type-btn" id="typeExpenseBtn" onclick="setType('expense')">− Расход</div>
      <div class="type-btn" id="typeIncomeBtn" onclick="setType('income')">+ Доход</div>
    </div>
    <input type="number" inputmode="decimal" id="amountInput" placeholder="Сумма, ₴">

    <label>Категория</label>
    <div class="chip-group" id="catButtons"></div>

    <label>Где хранятся деньги</label>
    <div class="chip-group" id="accButtons"></div>

    <label>Комментарий (необязательно)</label>
    <input type="text" id="commentInput" placeholder="Например: обед с коллегами">

    <button class="submit-btn" id="submitBtn" onclick="submitTx()">Добавить</button>
  </div>
</div>

<script>
// Безопасная обёртка на случай, если Telegram WebApp API недоступен (например, открыто не из Telegram)
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : {
  ready: function () {}, expand: function () {},
  showAlert: function (msg) { alert(msg); },
  showConfirm: function (msg, cb) { cb(confirm(msg)); },
  HapticFeedback: { notificationOccurred: function () {} },
  initData: ''
};
try { tg.ready(); tg.expand(); } catch (e) { console.error(e); }

const initData = tg.initData || "";
let currentType = "expense";
let selectedCategory = null;
let selectedAccount = null;
let categoriesList = ['Еда', 'Транспорт', 'Жильё', 'Развлечения', 'Здоровье', 'Одежда', 'Подписки', 'Прочее'];
let accountsList = ['Карта', 'Наличные', 'Валюта', 'Крипта', 'Другое'];
let lastSummary = null;
let lastTransactions = [];
let isSubmitting = false;
let currentModal = null;
const deletingIds = new Set();

const ACCOUNT_ICONS = { 'Карта': '💳', 'Наличные': '💵', 'Валюта': '💱', 'Крипта': '₿', 'Другое': '📦' };
const COLORS = ['#7c5cff', '#3ea6ff', '#ffb84d', '#ff5ea8', '#5be08a', '#ff6b6b', '#4dd0e1', '#c084fc'];

async function api(path, opts) {
  opts = opts || {};
  const res = await fetch(path, opts);
  const data = await res.json().catch(function () { return {}; });
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function fmt(n) { return new Intl.NumberFormat('uk-UA').format(Math.round(n)); }
function initials(name) { return (name || '?').trim().charAt(0).toUpperCase(); }

function showInvite() {
  if (!lastSummary) { tg.showAlert('Данные ещё загружаются, попробуйте через секунду'); return; }
  tg.showAlert(
    'Код приглашения: ' + lastSummary.invite_code + '\n\n' +
    'Партнёр вводит в боте: /link ' + lastSummary.invite_code + '\n\n' +
    'Участников в бюджете: ' + lastSummary.members.length
  );
}

// ---- фон карточки баланса ----
function applyBackground(url) {
  const card = document.getElementById('balanceCard');
  const house = document.getElementById('houseIcon');
  if (url) {
    card.style.backgroundImage =
      'linear-gradient(rgba(10,8,26,0.55), rgba(10,8,26,0.75)), url(' + url + ')';
    house.style.display = 'none';
    document.getElementById('bgResetBtn').style.display = 'flex';
  } else {
    card.style.backgroundImage = '';
    house.style.display = '';
    document.getElementById('bgResetBtn').style.display = 'none';
  }
}
function pickBackground(e) {
  if (e) e.stopPropagation();
  document.getElementById('bgFileInput').click();
}
function resetBackground(e) {
  if (e) e.stopPropagation();
  localStorage.removeItem('walletBgImage');
  applyBackground(null);
}
document.getElementById('bgFileInput').addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    const dataUrl = reader.result;
    try { localStorage.setItem('walletBgImage', dataUrl); } catch (err) { console.error(err); }
    applyBackground(dataUrl);
  };
  reader.readAsDataURL(file);
});
(function initBackground() {
  try {
    const saved = localStorage.getItem('walletBgImage');
    if (saved) applyBackground(saved);
  } catch (e) { console.error(e); }
})();

// ---- загрузка данных ----
async function loadData() {
  try {
    const summary = await api('/api/summary?init_data=' + encodeURIComponent(initData));
    lastSummary = summary;
    categoriesList = summary.categories || categoriesList;
    accountsList = summary.accounts || accountsList;

    document.getElementById('balance').textContent = fmt(summary.balance) + ' ₴';
    document.getElementById('balanceSub').textContent =
      'Доход ' + fmt(summary.total_income) + ' ₴ · Расход ' + fmt(summary.total_expense) + ' ₴';
    document.getElementById('inviteCode').textContent = summary.invite_code;

    const avatarRow = document.getElementById('avatarRow');
    avatarRow.innerHTML = '';
    (summary.members || []).forEach(function (m) {
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = initials(m.first_name || m.username);
      avatarRow.appendChild(av);
    });
    const addAv = document.createElement('div');
    addAv.className = 'avatar add';
    addAv.textContent = '+';
    addAv.onclick = function (e) { e.stopPropagation(); showInvite(); };
    avatarRow.appendChild(addAv);

    renderDonut(summary.by_category, summary.total_expense);
    renderStorageList(document.getElementById('storagePreview'), summary.by_account, false);
    renderMembers('members', summary.by_user, false);

    const txs = await api('/api/transactions?init_data=' + encodeURIComponent(initData) + '&limit=100');
    lastTransactions = txs;
    renderTxList('transactionsPreview', txs.slice(0, 5));

    // если модальное окно уже открыто — обновим и его содержимое
    if (currentModal) renderModalContent(currentModal);
  } catch (e) {
    console.error(e);
  }
}

function renderStorageList(el, byAccount, full) {
  byAccount = byAccount || {};
  el.innerHTML = '';
  const entries = accountsList.map(function (name) { return [name, byAccount[name] || { expense: 0, income: 0 }]; });
  const withMovement = entries.filter(function (e) { return e[1].expense > 0 || e[1].income > 0; });
  const list = full ? entries : (withMovement.length ? withMovement : entries.slice(0, 2));
  list.forEach(function (entry) {
    const name = entry[0], vals = entry[1];
    const balance = vals.income - vals.expense;
    const row = document.createElement('div');
    row.className = 'storage-row';
    row.innerHTML =
      '<div class="storage-icon">' + (ACCOUNT_ICONS[name] || '📦') + '</div>' +
      '<div class="storage-name">' + name + '</div>' +
      '<div class="storage-bal ' + (balance < 0 ? 'negative' : 'positive') + '">' +
      (balance >= 0 ? '+' : '') + fmt(balance) + ' ₴</div>';
    el.appendChild(row);
  });
  if (list.length === 0) el.innerHTML = '<div class="empty">Пока нет операций</div>';
}

function renderDonut(byCategory, total) {
  byCategory = byCategory || {};
  const svg = document.getElementById('donutSvg');
  const entries = Object.entries(byCategory).sort(function (a, b) { return b[1] - a[1]; });
  const r = 44, cx = 54, cy = 54, circumference = 2 * Math.PI * r;
  let offset = 0, paths = '';
  if (entries.length === 0 || !total) {
    paths = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>';
  } else {
    entries.forEach(function (entry, i) {
      const amt = entry[1];
      const len = (amt / total) * circumference;
      paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + COLORS[i % COLORS.length] + '" ' +
        'stroke-width="14" stroke-dasharray="' + len + ' ' + (circumference - len) + '" ' +
        'stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
      offset += len;
    });
  }
  svg.innerHTML = paths +
    '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" fill="white" font-size="15" font-weight="700">' + fmt(total || 0) + '</text>' +
    '<text x="' + cx + '" y="' + (cy + 13) + '" text-anchor="middle" fill="#8a8fa8" font-size="9">₴ расход</text>';
  renderLegend(document.getElementById('categories'), Object.fromEntries(entries), total || 0);
}

function renderLegend(el, data, total) {
  el.innerHTML = '';
  const entries = Object.entries(data).sort(function (a, b) { return b[1] - a[1]; });
  if (entries.length === 0) { el.innerHTML = '<div class="empty">Пока нет расходов</div>'; return; }
  entries.forEach(function (entry, i) {
    const name = entry[0], amt = entry[1];
    const pct = total > 0 ? Math.round((amt / total) * 100) : 0;
    const row = document.createElement('div');
    row.className = 'leg-row';
    row.innerHTML =
      '<div class="leg-dot" style="background:' + COLORS[i % COLORS.length] + '"></div>' +
      '<div class="leg-name">' + name + '</div>' +
      '<div class="leg-pct">' + pct + '%</div>' +
      '<div class="leg-amt">' + fmt(amt) + ' ₴</div>';
    el.appendChild(row);
  });
}

function renderMembers(containerId, byUser, full) {
  byUser = byUser || {};
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const entries = Object.entries(byUser);
  if (entries.length === 0) { el.innerHTML = '<div class="empty">Пока нет операций</div>'; return; }
  const maxExpense = Math.max.apply(null, entries.map(function (e) { return e[1].expense; }).concat([1]));
  const totalExpense = entries.reduce(function (s, e) { return s + e[1].expense; }, 0) || 1;
  entries.forEach(function (entry) {
    const name = entry[0], vals = entry[1];
    const pct = Math.round((vals.expense / totalExpense) * 100);
    const barPct = Math.round((vals.expense / maxExpense) * 100);
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML =
      '<div class="avatar" style="margin-right:0;">' + initials(name) + '</div>' +
      '<div class="m-info"><div class="m-name">' + name + '</div>' +
      '<div class="m-bar"><div class="m-bar-fill" style="width:' + barPct + '%"></div></div></div>' +
      '<div style="text-align:right;"><div class="m-amt">' + fmt(vals.expense) + ' ₴</div>' +
      '<div class="m-pct">' + pct + '%' + (full ? ' от расходов' : '') + '</div></div>';
    el.appendChild(row);
  });
}

function renderTxList(containerId, txs) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  if (!txs || txs.length === 0) { el.innerHTML = '<div class="empty">Пока нет операций</div>'; return; }
  txs.forEach(function (t) {
    const row = document.createElement('div');
    row.className = 'tx-row';
    const name = t.first_name || t.username || 'Кто-то';
    const sign = t.type === 'expense' ? '−' : '+';
    const icon = t.type === 'expense' ? (ACCOUNT_ICONS[t.account] || '💸') : '💰';
    row.innerHTML =
      '<div class="tx-icon">' + icon + '</div>' +
      '<div class="tx-info"><div class="tx-cat">' + t.category + (t.comment ? ' · ' + t.comment : '') + '</div>' +
      '<div class="tx-meta">' + name + ' · ' + (t.account || 'Наличные') + '</div></div>' +
      '<div class="tx-amt ' + t.type + '">' + sign + fmt(t.amount) + ' ₴</div>' +
      '<button class="tx-del" data-id="' + t.id + '">✕</button>';
    row.querySelector('.tx-del').addEventListener('click', function (e) { e.stopPropagation(); confirmDelete(t.id); });
    el.appendChild(row);
  });
}

function confirmDelete(id) {
  if (deletingIds.has(id)) return;
  tg.showConfirm('Удалить эту операцию?', function (ok) {
    if (!ok) return;
    deletingIds.add(id);
    api('/api/transactions', {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, id: id }),
    }).then(function () {
      tg.HapticFeedback.notificationOccurred('success');
      return loadData();
    }).catch(function () {
      tg.showAlert('Не удалось удалить операцию. Попробуйте ещё раз.');
    }).finally(function () {
      deletingIds.delete(id);
    });
  });
}

// ---- модальные окна: открываются сразу, содержимое подгружается/обновляется отдельно ----
function openModal(name) {
  currentModal = name;
  document.getElementById('navHome').classList.remove('active');
  document.getElementById('modalOverlay').classList.add('open'); // открываем сразу, без ожидания данных
  renderModalContent(name);
}

function renderModalContent(name) {
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');
  if (!lastSummary) {
    body.innerHTML = '<div class="empty">Загрузка…</div>';
    return;
  }
  try {
    if (name === 'tx') {
      title.textContent = 'Все операции';
      body.innerHTML = '<div id="modalTxList"></div>';
      renderTxList('modalTxList', lastTransactions);
    } else if (name === 'analytics') {
      title.textContent = 'Аналитика расходов';
      renderModalAnalytics(body);
    } else if (name === 'family') {
      title.textContent = 'Семья';
      renderModalFamily(body);
    } else if (name === 'storage') {
      title.textContent = 'Где хранятся деньги';
      body.innerHTML = '<div id="modalStorageList"></div>' +
        '<div style="font-size:11.5px; color:var(--hint); margin-top:12px;">Баланс = сумма доходов минус сумма расходов, отмеченных для этого места хранения.</div>';
      renderStorageList(document.getElementById('modalStorageList'), lastSummary.by_account, true);
    }
  } catch (e) {
    console.error(e);
    body.innerHTML = '<div class="empty">Не удалось загрузить данные</div>';
  }
}

function renderModalAnalytics(body) {
  const total = lastSummary.total_expense;
  body.innerHTML =
    '<div style="display:flex; justify-content:center; margin-bottom:14px;">' +
    '<svg id="modalDonut" width="150" height="150" viewBox="0 0 108 108"></svg></div>' +
    '<div id="modalCatLegend"></div>' +
    '<div style="height:1px; background:rgba(255,255,255,0.08); margin:16px 0;"></div>' +
    '<div style="font-size:13px; font-weight:700; margin-bottom:10px;">Доход vs расход</div>' +
    '<div class="leg-row"><div class="leg-dot" style="background:#5be08a"></div><div class="leg-name">Доход</div><div class="leg-amt">' + fmt(lastSummary.total_income) + ' ₴</div></div>' +
    '<div class="leg-row"><div class="leg-dot" style="background:#ff6b81"></div><div class="leg-name">Расход</div><div class="leg-amt">' + fmt(lastSummary.total_expense) + ' ₴</div></div>';

  const svg = document.getElementById('modalDonut');
  const entries = Object.entries(lastSummary.by_category).sort(function (a, b) { return b[1] - a[1]; });
  const r = 44, cx = 54, cy = 54, circumference = 2 * Math.PI * r;
  let offset = 0, paths = '';
  if (entries.length === 0 || !total) {
    paths = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>';
  } else {
    entries.forEach(function (entry, i) {
      const len = (entry[1] / total) * circumference;
      paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + COLORS[i % COLORS.length] + '" ' +
        'stroke-width="14" stroke-dasharray="' + len + ' ' + (circumference - len) + '" ' +
        'stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
      offset += len;
    });
  }
  svg.innerHTML = paths +
    '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" fill="white" font-size="15" font-weight="700">' + fmt(total || 0) + '</text>' +
    '<text x="' + cx + '" y="' + (cy + 13) + '" text-anchor="middle" fill="#8a8fa8" font-size="9">₴ расход</text>';
  renderLegend(document.getElementById('modalCatLegend'), Object.fromEntries(entries), total || 0);
}

function renderModalFamily(body) {
  body.innerHTML =
    '<div id="modalMembers" class="member-list" style="margin-bottom:16px;"></div>' +
    '<div style="height:1px; background:rgba(255,255,255,0.08); margin:16px 0;"></div>' +
    '<div class="invite-row" style="margin-bottom:6px;"><span>Код приглашения</span><code>' + lastSummary.invite_code + '</code></div>' +
    '<div style="font-size:11.5px; color:var(--hint);">Партнёр вводит в боте: /link ' + lastSummary.invite_code + '</div>';
  renderMembers('modalMembers', lastSummary.by_user, true);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('navHome').classList.add('active');
  currentModal = null;
}
function closeOnModalOverlay(e) { if (e.target.id === 'modalOverlay') closeModal(); }

// ---- форма добавления: тоже открывается сразу ----
function setType(type) {
  currentType = type;
  document.getElementById('typeExpenseBtn').className = 'type-btn' + (type === 'expense' ? ' sel-expense' : '');
  document.getElementById('typeIncomeBtn').className = 'type-btn' + (type === 'income' ? ' sel-income' : '');
  renderCatButtons();
}

function renderCatButtons() {
  selectedCategory = null;
  const catButtons = document.getElementById('catButtons');
  catButtons.innerHTML = '';
  const cats = currentType === 'expense' ? categoriesList : ['Зарплата', 'Подарок', 'Прочее'];
  cats.forEach(function (c) {
    const btn = document.createElement('div');
    btn.className = 'chip-btn';
    btn.textContent = c;
    btn.onclick = function () {
      catButtons.querySelectorAll('.chip-btn').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      selectedCategory = c;
    };
    catButtons.appendChild(btn);
  });
}

function openSheet(type) {
  document.getElementById('overlay').classList.add('open'); // открываем сразу
  try {
    document.getElementById('amountInput').value = '';
    document.getElementById('commentInput').value = '';
    setType(type);
    selectedAccount = accountsList[1] || accountsList[0];

    const accButtons = document.getElementById('accButtons');
    accButtons.innerHTML = '';
    accountsList.forEach(function (a) {
      const btn = document.createElement('div');
      btn.className = 'chip-btn' + (a === selectedAccount ? ' selected' : '');
      btn.textContent = (ACCOUNT_ICONS[a] || '') + ' ' + a;
      btn.onclick = function () {
        accButtons.querySelectorAll('.chip-btn').forEach(function (b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        selectedAccount = a;
      };
      accButtons.appendChild(btn);
    });
  } catch (e) { console.error(e); }
}
function closeSheet() { document.getElementById('overlay').classList.remove('open'); }
function closeOnOverlay(e) { if (e.target.id === 'overlay') closeSheet(); }

async function submitTx() {
  if (isSubmitting) return;
  const amount = parseFloat(document.getElementById('amountInput').value);
  if (!amount || amount <= 0) { tg.showAlert('Введите сумму'); return; }
  const category = selectedCategory || 'Прочее';
  const account = selectedAccount || 'Наличные';
  const comment = document.getElementById('commentInput').value;

  isSubmitting = true;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Добавляем…';

  try {
    await api('/api/transactions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, amount: amount, type: currentType, category: category, account: account, comment: comment })
    });
    closeSheet();
    tg.HapticFeedback.notificationOccurred('success');
    await loadData();
  } catch (e) {
    tg.showAlert('Не получилось сохранить операцию');
  } finally {
    isSubmitting = false;
    btn.disabled = false;
    btn.textContent = 'Добавить';
  }
}

loadData();
</script>
</body>
</html>
