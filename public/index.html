<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mivaro</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #05070d;
    --text: #ffffff;
    --hint: #8a94ad;
    --card: rgba(255,255,255,0.05);
    --purple: #2563eb;
    --pink: #93c5fd;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 14px 14px 100px;
  }

  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .topbar .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center; font-size: 16px; border: 1px solid rgba(255,255,255,0.08); color: white;
  }
  .topbar .title { font-size: 17px; font-weight: 800; display:flex; align-items:center; gap: 8px; }
  .brand-logo { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; }

  .period-row { display:flex; align-items:center; gap: 8px; margin-bottom: 12px; }
  .period-nav { display:flex; align-items:center; gap: 4px; background: var(--card); border-radius: 12px; padding: 4px; flex: 1; }
  .period-nav button { background:none; border:none; color:white; width: 28px; height: 28px; border-radius: 8px; font-size: 14px; }
  .period-nav .label { flex:1; text-align:center; font-size: 12.5px; font-weight: 600; }
  .period-all-btn {
    background: var(--card); border: 1px solid transparent; color: var(--hint); border-radius: 12px;
    padding: 0 12px; height: 36px; font-size: 12px; white-space: nowrap;
  }
  .period-all-btn.active { background: var(--purple); color: white; border-color: var(--purple); }

  .balance-card {
    background: radial-gradient(circle at 100% 0%, rgba(147,197,253,0.18) 0%, transparent 45%),
                linear-gradient(150deg, #1e3a8a 0%, #1d2a5e 45%, #05070d 100%);
    background-size: cover; background-position: center;
    border-radius: 22px; padding: 20px; margin-bottom: 12px; position: relative; overflow: hidden;
    border: 1px solid rgba(147,197,253,0.15); min-height: 150px;
  }
  .balance-card .house { position: absolute; right: 14px; top: 18px; width: 108px; height: 108px; }
  .balance-label { font-size: 12px; color: rgba(255,255,255,0.75); display:flex; align-items:center; gap:5px; }
  .balance { font-size: 32px; font-weight: 800; margin: 6px 0 10px; letter-spacing: -0.5px; text-shadow: 0 1px 6px rgba(0,0,0,0.4); }
  .balance-badge {
    display:inline-flex; align-items:center; background: rgba(16,185,129,0.22); color: #6ee7b7;
    border: 1px solid rgba(110,231,183,0.3); border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 700;
  }
  .balance-badge.negative { background: rgba(255,107,129,0.2); color: #ffb3c0; border-color: rgba(255,179,192,0.3); }
  .balance-period-caption { font-size: 11.5px; color: rgba(255,255,255,0.55); margin-top: 8px; }

  .receipt-scan-btn {
    position: absolute; right: 12px; bottom: 12px; width: 36px; height: 36px; border-radius: 12px;
    background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.18); color: white; font-size: 15px;
  }

  .bg-edit-btn {
    position: absolute; right: 10px; top: 10px; width: 30px; height: 30px; border-radius: 10px;
    background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.18); color: white; font-size: 13px;
  }
  .bg-reset-btn {
    position: absolute; right: 46px; top: 10px; width: 30px; height: 30px; border-radius: 10px;
    background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.18); color: white; font-size: 12px; display: none;
  }

  .avatar-row { display:flex; align-items:center; margin-top: 16px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    font-size: 13px; font-weight: 700; color: white; border: 2px solid #241a4a; margin-right: -10px;
    background: linear-gradient(135deg, var(--purple), var(--pink)); flex-shrink: 0;
  }
  .avatar.add { background: rgba(255,255,255,0.18); border-style: dashed; font-size: 16px; }

  .action-row { display:flex; gap: 8px; margin-bottom: 12px; }
  .action-btn {
    flex: 1; background: var(--card); border-radius: 16px; padding: 14px 6px 12px; text-align: center;
    border: none; color: white; font-family: inherit; cursor: pointer;
  }
  .action-btn .lb { font-size: 10.5px; color: var(--hint); }

  .ic-badge {
    width: 38px; height: 38px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    font-size: 17px; margin: 0 auto 7px;
  }
  .badge-green { background: rgba(16,185,129,0.16); color: #34d399; }
  .badge-blue { background: rgba(59,130,246,0.16); color: #60a5fa; }
  .badge-purple { background: rgba(139,92,246,0.16); color: #a78bfa; }
  .badge-orange { background: rgba(249,115,22,0.16); color: #fb923c; }

  .section-card {
    background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px;
    border: none; width: 100%; text-align: left; color: white; font-family: inherit; display: block;
  }
  .section-head { display:flex; align-items:center; gap: 12px; margin-bottom: 12px; }
  .section-head .sh-icon { flex-shrink: 0; margin: 0; }
  .section-head .sh-text { flex: 1; min-width: 0; }
  .section-head .h { font-size: 14.5px; font-weight: 700; }
  .section-head .sub { font-size: 11.5px; color: var(--hint); margin-top: 2px; }
  .section-head .more { font-size: 11.5px; color: #a78bfa; white-space: nowrap; flex-shrink: 0; }

  .donut-wrap { display:flex; align-items:center; gap: 16px; }
  .donut-legend { flex:1; min-width:0; }
  .leg-row { display:flex; align-items:center; gap: 8px; padding: 6px 0; font-size: 12.5px; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .leg-name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  .leg-pct { color: var(--hint); font-size: 11px; width: 30px; text-align:right; }
  .leg-amt { font-weight: 600; width: 62px; text-align:right; font-size: 12px; }

  .member-list { display:flex; flex-direction:column; gap: 10px; }
  .member-row { display:flex; align-items:center; gap: 10px; }
  .member-row .m-info { flex: 1; min-width: 0; }
  .member-row .m-name { font-size: 13px; font-weight: 600; }
  .member-row .m-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 5px; overflow:hidden; }
  .member-row .m-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--purple), var(--pink)); }
  .member-row .m-amt { font-size: 13px; font-weight: 700; }
  .member-row .m-pct { font-size: 10.5px; color: var(--hint); text-align:right; }

  .storage-row { display:flex; align-items:center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .storage-row:last-child { border-bottom: none; }
  .storage-icon { width: 34px; height: 34px; border-radius: 11px; background: rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .storage-name { flex:1; font-size: 13px; }
  .storage-bal { font-weight: 700; font-size: 13.5px; }
  .storage-bal.negative { color: #ff6b81; }
  .storage-bal.positive { color: #5be08a; }

  .tx-row { display:flex; align-items:center; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .tx-row:last-child { border-bottom: none; }
  .tx-icon { width: 38px; height: 38px; border-radius: 12px; display:flex; align-items:center; justify-content:center; font-size: 16px; flex-shrink:0; background: rgba(255,255,255,0.06); }
  .tx-info { flex:1; min-width:0; }
  .tx-cat { font-size: 13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx-meta { font-size: 11px; color: var(--hint); margin-top: 1px; }
  .tx-amt { font-weight: 700; font-size: 13.5px; white-space:nowrap; }
  .tx-amt.expense { color: #ff6b81; }
  .tx-amt.income { color: #5be08a; }
  .tx-edit, .tx-del { background:none; border:none; color: var(--hint); font-size: 14px; padding: 4px; opacity: 0.6; }

  .invite-row { display:flex; align-items:center; justify-content:space-between; font-size: 12.5px; color: var(--hint); }
  .invite-row code { background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 8px; color: white; font-size: 13px; }

  .empty { color: var(--hint); font-size: 13px; padding: 4px 0; }

  .bottom-nav {
    position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 8;
    background: rgba(20,16,40,0.92); backdrop-filter: blur(10px);
    border-radius: 22px; padding: 8px 6px; display:flex; align-items:center; justify-content:space-around;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .nav-item { background:none; border:none; color: var(--hint); font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:3px; font-size: 9.5px; padding: 4px 6px; }
  .nav-item.active { color: white; }
  .nav-item .ic { font-size: 18px; }
  .nav-fab {
    width: 46px; height: 46px; border-radius: 50%; border:none; margin-top: -22px;
    background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; font-size: 22px;
    display:flex; align-items:center; justify-content:center;
  }

  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: flex-end; z-index: 20; }
  .sheet-overlay.open { display: flex; }
  .sheet { background: #14102a; width: 100%; border-radius: 22px 22px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 4px; }
  .sheet h2 { font-size: 17px; }
  .sheet-close { background: rgba(255,255,255,0.08); border: none; color: white; width: 30px; height: 30px; border-radius: 10px; font-size: 14px; }

  .type-toggle { display:flex; gap: 8px; margin: 14px 0; }
  .type-btn { flex:1; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: white; font-size: 13.5px; font-weight:600; text-align:center; }
  .type-btn.sel-expense { background: #ff6b81; border-color: #ff6b81; color: #400; }
  .type-btn.sel-income { background: #5be08a; border-color: #5be08a; color: #043; }
  .sheet label { font-size: 11.5px; color: var(--hint); display:block; margin: 12px 0 6px; }
  .sheet input { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: white; font-size: 16px; }
  .chip-group { display:flex; flex-wrap:wrap; gap: 7px; }
  .chip-btn { padding: 7px 13px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: white; font-size: 12.5px; }
  .chip-btn.selected { background: var(--purple); border-color: var(--purple); }
  .submit-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; margin-top: 18px; background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; font-size: 15px; font-weight: 700; }
  .submit-btn:disabled { opacity: 0.5; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 25; padding: 40px 14px 14px; }
  .modal-overlay.open { display: block; }
  .modal-box { background: #14102a; border-radius: 20px; padding: 18px; max-height: calc(100vh - 60px); overflow-y: auto; border: 1px solid rgba(255,255,255,0.08); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .modal-head h2 { font-size: 17px; }
  .modal-close { background: rgba(255,255,255,0.08); border: none; color: white; width: 32px; height: 32px; border-radius: 10px; font-size: 15px; }

  /* ===== Меню ===== */
  .menu-item {
    display:flex; align-items:center; gap: 12px; width: 100%; background: var(--card); border: none;
    color: white; padding: 14px; border-radius: 14px; margin-bottom: 8px; font-size: 13.5px; font-family: inherit; text-align:left;
  }
  .menu-item .ic { font-size: 17px; width: 22px; text-align:center; flex-shrink:0; }
  .menu-item .lb { flex:1; }
  .menu-item .chev { color: var(--hint); font-size: 14px; }

  /* ===== Сегментный переключатель (табы, тема) ===== */
  .seg-toggle { display:flex; align-items:center; gap: 4px; background: var(--card); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .seg-btn { flex:1; background:none; border:none; color: var(--hint); font-family: inherit; padding: 9px 4px; border-radius: 9px; font-size: 12.5px; font-weight: 600; text-align:center; }
  .seg-btn.active { background: var(--purple); color: white; }

  /* ===== Списки-настройки ===== */
  .settings-group-label { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: 0.03em; margin: 16px 0 8px; }
  .settings-group-label:first-child { margin-top: 0; }
  .list-row {
    display:flex; align-items:center; gap: 10px; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    background: none; border-left:none; border-right:none; border-top:none; width: 100%; color: white; font-family: inherit; text-align:left; font-size: 13.5px;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .lr-name { flex: 1; min-width: 0; }
  .list-row .lr-sub { font-size: 11px; color: var(--hint); margin-top: 2px; }
  .list-row .lr-val { color: var(--hint); font-size: 12.5px; }
  .list-row .lr-chev { color: var(--hint); font-size: 13px; margin-left: 2px; }
  .list-row input[type="time"] {
    background: none; border: none; color: white; font-family: inherit; font-size: 13.5px; text-align: right;
    color-scheme: dark;
  }
  .card-hint { font-size: 11.5px; color: var(--hint); margin-top: 8px; line-height: 1.4; }

  .toggle-switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-switch .slider {
    position: absolute; inset: 0; background: rgba(255,255,255,0.14); border-radius: 999px; transition: 0.2s; cursor: pointer;
  }
  .toggle-switch .slider::before {
    content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s;
  }
  .toggle-switch input:checked + .slider { background: var(--purple); }
  .toggle-switch input:checked + .slider::before { transform: translateX(18px); }

  /* ===== Категории ===== */
  .cat-row { display:flex; align-items:center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); width:100%; background:none; border-left:none; border-right:none; border-top:none; color:white; font-family:inherit; text-align:left; }
  .cat-row:last-child { border-bottom: none; }
  .cat-icon { width: 36px; height: 36px; border-radius: 11px; background: rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .cat-name { flex: 1; font-size: 13.5px; min-width:0; }
  .cat-tag { font-size: 9.5px; color: var(--hint); background: rgba(255,255,255,0.06); padding: 2px 7px; border-radius: 6px; margin-right: 4px; white-space:nowrap; }
  .cat-chev { color: var(--hint); font-size: 13px; }
  .cat-count { text-align:center; font-size: 11.5px; color: var(--hint); margin: 12px 0 10px; }
  .add-cat-btn {
    width: 100%; padding: 13px; border: 1px dashed rgba(255,255,255,0.25); border-radius: 14px; background: none;
    color: white; font-family: inherit; font-size: 13.5px; font-weight: 600;
  }

  /* ===== Бюджеты ===== */
  .budget-row { padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06); width:100%; background:none; border-left:none; border-right:none; border-top:none; color:white; font-family:inherit; text-align:left; }
  .budget-row:last-child { border-bottom: none; }
  .budget-top { display:flex; align-items:center; gap: 10px; }
  .budget-top .cat-name { font-size: 13.5px; }
  .budget-val { font-size: 12.5px; color: var(--hint); }
  .budget-val.set { color: white; font-weight: 600; }
  .budget-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 8px; margin-left: 46px; overflow:hidden; }
  .budget-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--purple), var(--pink)); }
  .budget-bar-fill.over { background: #ff6b81; }

  /* ===== Промпт-шторка (редактирование категории/бюджета/таймзоны) ===== */
  .prompt-overlay { z-index: 30; }
  .icon-input-row { display:flex; gap: 10px; }
  .icon-input-row input#promptIcon { width: 62px; text-align:center; font-size: 20px; flex-shrink:0; }

  /* ===== Шорткат ===== */
  .shortcut-hero { display:flex; gap: 12px; align-items:flex-start; background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .shortcut-hero .ic { width: 44px; height: 44px; border-radius: 13px; background: rgba(124,92,255,0.18); display:flex; align-items:center; justify-content:center; font-size: 20px; flex-shrink:0; }
  .shortcut-hero h3 { font-size: 15px; margin-bottom: 3px; }
  .shortcut-hero p { font-size: 12px; color: var(--hint); line-height: 1.4; }
  .key-box { background: var(--card); border-radius: 14px; padding: 13px 14px; display:flex; align-items:center; gap: 10px; margin-bottom: 6px; }
  .key-box code { flex:1; font-size: 12.5px; color: white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .key-copy-btn { background:none; border:none; color: var(--purple); font-weight: 700; font-size: 12.5px; white-space:nowrap; }
  .step-row { display:flex; align-items:center; gap: 12px; background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--purple); color:white; font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .step-text { font-size: 13px; flex:1; }
  .invoke-row { display:flex; align-items:center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .invoke-row:last-child { border-bottom:none; }
  .invoke-row .ic { font-size: 17px; width: 24px; text-align:center; flex-shrink:0; color: var(--hint); }
  .invoke-row .txt strong { display:block; font-size: 13px; margin-bottom: 2px; }
  .invoke-row .txt span { font-size: 11px; color: var(--hint); }

  /* ===== Онбординг ===== */
  .onboard-dots { display:flex; gap: 5px; }
  .onboard-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.18); }
  .onboard-dot.active { width: 16px; background: var(--purple); }
  .onboard-illustration {
    background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; text-align:center;
  }
  .onboard-illustration .emoji { font-size: 34px; margin-bottom: 8px; }
  .onboard-title { font-size: 16px; font-weight: 700; text-align:center; margin-bottom: 8px; }
  .onboard-desc { font-size: 13px; color: var(--hint); text-align:center; line-height: 1.5; margin-bottom: 20px; }
  .onboard-nav { display:flex; align-items:center; justify-content:space-between; }
  .onboard-nav button { background:none; border:none; color: white; font-size: 13.5px; font-weight: 600; padding: 8px; }
  .onboard-nav .skip { color: var(--hint); font-weight: 500; }

  /* ===== Светлая тема ===== */
  body.theme-light {
    --bg: #f3f4f9; --text: #14141c; --hint: #6b7086; --card: rgba(20,20,45,0.055);
  }
  body.theme-light .sheet, body.theme-light .modal-box { background: #ffffff; border-color: rgba(0,0,0,0.06); }
  body.theme-light .bottom-nav { background: rgba(255,255,255,0.9); border-color: rgba(0,0,0,0.06); }
  body.theme-light .nav-item.active { color: var(--text); }
  body.theme-light .sheet input, body.theme-light .type-btn, body.theme-light .chip-btn, body.theme-light .action-btn {
    background: rgba(20,20,45,0.05); border-color: rgba(0,0,0,0.08); color: var(--text);
  }
  body.theme-light .icon-btn { background: rgba(20,20,45,0.06); color: var(--text); }
  body.theme-light .sheet-close, body.theme-light .modal-close { background: rgba(20,20,45,0.07); color: var(--text); }
  body.theme-light .list-row, body.theme-light .cat-row, body.theme-light .budget-row { border-bottom-color: rgba(0,0,0,0.06); }
  body.theme-light .list-row input[type="time"] { color: var(--text); color-scheme: light; }
  body.theme-light .cat-icon, body.theme-light .storage-icon, body.theme-light .step-row, body.theme-light .shortcut-hero, body.theme-light .key-box, body.theme-light .onboard-illustration, body.theme-light .receipt-item {
    background: rgba(20,20,45,0.05);
  }

const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : {
  ready: function () {}, expand: function () {},
  showAlert: function (msg) { alert(msg); },
  showConfirm: function (msg, cb) { cb(confirm(msg)); },
  HapticFeedback: { notificationOccurred: function () {} },
  initData: ''
};
try { tg.ready(); tg.expand(); } catch (e) { console.error(e); }

let initData = tg.initData || "";

// Иногда скрипт telegram-web-app.js не успевает полностью инициализироваться (медленная сеть и т.п.),
// и initData на первый момент оказывается пустым. Даём ему до 2 секунд шанс появиться,
// прежде чем показывать ошибку и работать с пустыми данными.
function waitForInitData(maxWaitMs) {
  return new Promise(function (resolve) {
    if (initData) { resolve(); return; }
    const start = Date.now();
    const iv = setInterval(function () {
      const fresh = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || '';
      if (fresh) {
        initData = fresh;
        clearInterval(iv);
        resolve();
      } else if (Date.now() - start > maxWaitMs) {
        clearInterval(iv);
        resolve(); // не дождались — идём дальше с тем, что есть (ошибку покажет сам loadData)
      }
    }, 100);
  });
}

async function fetchMonthlyTrends() {
  const refNow = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(refNow.getFullYear(), refNow.getMonth() - i, 1);
    months.push({ year: d.getFullYear(), month: d.getMonth() });
  }
  const rangeStart = Math.floor(new Date(months[0].year, months[0].month, 1).getTime() / 1000);
  const rangeEnd = Math.floor(new Date(months[5].year, months[5].month + 1, 0, 23, 59, 59).getTime() / 1000);

  const txs = await api('/api/transactions?init_data=' + encodeURIComponent(initData) + '&limit=3000&start=' + rangeStart + '&end=' + rangeEnd);

  const buckets = {};
  months.forEach(function (m) { buckets[m.year + '-' + m.month] = { expense: 0, income: 0, label: MONTH_SHORT[m.month] }; });
  txs.forEach(function (t) {
    const d = new Date(t.created_at * 1000);
    const key = d.getFullYear() + '-' + d.getMonth();
    if (!buckets[key]) return;
    const amt = Number(t.amount);
    if (t.type === 'expense') buckets[key].expense += amt; else buckets[key].income += amt;
  });
  return months.map(function (m) { return buckets[m.year + '-' + m.month]; });
}

async function fetchWeeklyBreakdown(year, month) {
  const start = Math.floor(new Date(year, month, 1).getTime() / 1000);
  const end = Math.floor(new Date(year, month + 1, 0, 23, 59, 59).getTime() / 1000);
  const txs = await api('/api/transactions?init_data=' + encodeURIComponent(initData) + '&limit=3000&start=' + start + '&end=' + end);

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const weekCount = Math.ceil(daysInMonth / 7);
  const buckets = [];
  for (let i = 0; i < weekCount; i++) buckets.push({ expense: 0, income: 0, label: (i + 1) + '-я нед.' });

  txs.forEach(function (t) {
    const d = new Date(t.created_at * 1000);
    const idx = Math.min(Math.floor((d.getDate() - 1) / 7), weekCount - 1);
    const amt = Number(t.amount);
    if (t.type === 'expense') buckets[idx].expense += amt; else buckets[idx].income += amt;
  });
  return buckets;
}

function renderBarChart(container, buckets, maxHeightPx) {
  maxHeightPx = maxHeightPx || 84;
  const maxVal = Math.max.apply(null, buckets.map(function (b) { return Math.max(b.expense, b.income); }).concat([1]));
  let html = '<div style="display:flex; align-items:flex-end; gap:6px; height:' + (maxHeightPx + 22) + 'px;">';
  buckets.forEach(function (b) {
    const expH = b.expense > 0 ? Math.max(3, Math.round((b.expense / maxVal) * maxHeightPx)) : 0;
    const incH = b.income > 0 ? Math.max(3, Math.round((b.income / maxVal) * maxHeightPx)) : 0;
    html += '<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">' +
      '<div style="display:flex; align-items:flex-end; gap:2px; height:' + maxHeightPx + 'px;">' +
      '<div style="width:8px; border-radius:3px 3px 0 0; background:#5be08a; height:' + incH + 'px;"></div>' +
      '<div style="width:8px; border-radius:3px 3px 0 0; background:#ff6b81; height:' + expH + 'px;"></div>' +
      '</div>' +
      '<div style="font-size:9px; color:var(--hint); white-space:nowrap;">' + b.label + '</div>' +
      '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

async function loadData() {
  try {
    const range = getPeriodRange();
    let qs = 'init_data=' + encodeURIComponent(initData);
    if (range.start != null) qs += '&start=' + range.start + '&end=' + range.end;

    const summary = await api('/api/summary?' + qs);
    lastSummary = summary;
    if (!accountsWereLocal && summary.accounts && summary.accounts.length) {
      accounts = summary.accounts.map(function (name) {
        const def = DEFAULT_ACCOUNTS.find(function (d) { return d.name === name; });
        return { name: name, icon: def ? def.icon : '📦', system: false, currency: def ? def.currency : 'UAH', bank: '', balance: null, isCredit: false };
      });
      persistAccounts();
      accountsWereLocal = true;
    }

    const overallBalance = summary.overall_balance != null ? summary.overall_balance : summary.balance;
    document.getElementById('balance').textContent = fmt(overallBalance) + ' ₴';

    const periodNet = summary.total_income - summary.total_expense;
    const baseBalance = overallBalance - periodNet;
    const pct = baseBalance !== 0 ? (periodNet / Math.abs(baseBalance)) * 100 : null;
    const badge = document.getElementById('balanceBadge');
    const sign = periodNet >= 0 ? '+' : '−';
    badge.textContent = sign + fmt(Math.abs(periodNet)) + ' ₴' + (pct != null ? ' (' + Math.abs(pct).toFixed(2) + '%)' : '');
    badge.className = 'balance-badge' + (periodNet < 0 ? ' negative' : '');

    document.getElementById('inviteCode').textContent = summary.invite_code;

    const avatarRow = document.getElementById('avatarRow');
    avatarRow.innerHTML = '';
    (summary.members || []).forEach(function (m) {
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = initials(m.first_name || m.username);
      avatarRow.appendChild(av);
    });
    const addAv = document.createElement('div');
    addAv.className = 'avatar add';
    addAv.textContent = '+';
    addAv.onclick = function (e) { e.stopPropagation(); showInvite(); };
    avatarRow.appendChild(addAv);

    renderDonut(summary.by_category, summary.total_expense);
    renderStorageList(document.getElementById('storagePreview'), summary.by_account, false);
    renderMembers('members', summary.by_user, false);

    let txQs = 'init_data=' + encodeURIComponent(initData) + '&limit=200';
    if (range.start != null) txQs += '&start=' + range.start + '&end=' + range.end;
    const txs = await api('/api/transactions?' + txQs);
    lastTransactions = txs;
    renderTxList('transactionsPreview', txs.slice(0, 5));

    if (currentModal) renderModalContent(currentModal);
    maybeStartOnboarding();
    refreshBudgetsPreview();
  } catch (e) {
    console.error(e);
    if (!initData) {
      const diag =
        'hasTelegramObj=' + !!window.Telegram +
        ' hasWebApp=' + !!(window.Telegram && window.Telegram.WebApp) +
        ' platform=' + (tg.platform || 'н/д') +
        ' version=' + (tg.version || 'н/д') +
        ' initDataLen=' + (tg.initData ? tg.initData.length : 0);
      showToast('Сессия Telegram не подтверждена. [' + diag + ']');
      console.error('DIAG:', diag);
    } else {
      showToast('Не удалось обновить данные. Проверьте соединение и потяните вниз для обновления.');
    }
  }
}

function renderDonut(byCategory, total) {
  byCategory = byCategory || {};
  const svg = document.getElementById('donutSvg');
  const entries = Object.entries(byCategory).sort(function (a, b) { return b[1] - a[1]; });
  const r = 44, cx = 54, cy = 54, circumference = 2 * Math.PI * r;
  let offset = 0, paths = '';
  if (entries.length === 0 || !total) {
    paths = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>';
  } else {
    entries.forEach(function (entry, i) {
      const len = (entry[1] / total) * circumference;
      paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + COLORS[i % COLORS.length] + '" ' +
        'stroke-width="14" stroke-dasharray="' + len + ' ' + (circumference - len) + '" ' +
        'stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
      offset += len;
    });
  }
  svg.innerHTML = paths +
    '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" fill="white" font-size="15" font-weight="700">' + fmt(total || 0) + '</text>' +
    '<text x="' + cx + '" y="' + (cy + 13) + '" text-anchor="middle" fill="#8a8fa8" font-size="9">₴ расход</text>';
  renderLegend(document.getElementById('categories'), Object.fromEntries(entries), total || 0);
}

function renderLegend(el, data, total) {
  el.innerHTML = '';
  const entries = Object.entries(data).sort(function (a, b) { return b[1] - a[1]; });
  if (entries.length === 0) { el.innerHTML = '<div class="empty">Пока нет расходов</div>'; return; }
  entries.forEach(function (entry, i) {
    const name = entry[0], amt = entry[1];
    const pct = total > 0 ? Math.round((amt / total) * 100) : 0;
    const row = document.createElement('div');
    row.className = 'leg-row';
    row.innerHTML =
      '<div class="leg-dot" style="background:' + COLORS[i % COLORS.length] + '"></div>' +
      '<div class="leg-name">' + name + '</div>' +
      '<div class="leg-pct">' + pct + '%</div>' +
      '<div class="leg-amt">' + fmt(amt) + ' ₴</div>';
    el.appendChild(row);
  });
}

function renderMembers(containerId, byUser, full) {
  byUser = byUser || {};
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const entries = Object.entries(byUser);
  if (entries.length === 0) { el.innerHTML = '<div class="empty">Пока нет операций</div>'; return; }
  const maxExpense = Math.max.apply(null, entries.map(function (e) { return e[1].expense; }).concat([1]));
  const totalExpense = entries.reduce(function (s, e) { return s + e[1].expense; }, 0) || 1;
  entries.forEach(function (entry) {
    const name = entry[0], vals = entry[1];
    const pct = Math.round((vals.expense / totalExpense) * 100);
    const barPct = Math.round((vals.expense / maxExpense) * 100);
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML =
      '<div class="avatar" style="margin-right:0;">' + initials(name) + '</div>' +
      '<div class="m-info"><div class="m-name">' + name + '</div>' +
      '<div class="m-bar"><div class="m-bar-fill" style="width:' + barPct + '%"></div></div></div>' +
      '<div style="text-align:right;"><div class="m-amt">' + fmt(vals.expense) + ' ₴</div>' +
      '<div class="m-pct">' + pct + '%' + (full ? ' от расходов' : '') + '</div></div>';
    el.appendChild(row);
  });
}

function fmtShortDateTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const now3 = new Date();
  const sameYear = d.getFullYear() === now3.getFullYear();
  const dateStr = d.toLocaleDateString('ru-RU', sameYear ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
  const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  return dateStr + ', ' + timeStr;
}

let txModalExtra = [];
let txQuery = '';
let txTypeFilter = 'all';
let txAccountFilter = 'all';
let txHasMore = true;

function resetTxFilters() {
  txModalExtra = [];
  txQuery = '';
  txTypeFilter = 'all';
  txAccountFilter = 'all';
  txHasMore = true;
}

function combinedTxList() { return lastTransactions.concat(txModalExtra); }

function filteredTxList() {
  const q = txQuery.trim().toLowerCase();
  return combinedTxList().filter(function (t) {
    if (txTypeFilter !== 'all' && t.type !== txTypeFilter) return false;
    if (txAccountFilter !== 'all' && (t.account || 'Наличные') !== txAccountFilter) return false;
    if (q) {
      const hay = (t.category + ' ' + (t.comment || '') + ' ' + (t.first_name || '') + ' ' + (t.username || '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function renderTxModal(body) {
  const accChips = accountsList.map(function (a) {
    return '<button class="tx-chip' + (txAccountFilter === a ? ' active' : '') + '" data-acc="' + a + '">' + accIcon(a) + ' ' + a + '</button>';
  }).join('');
  body.innerHTML =
    '<input type="text" class="tx-search" id="txSearchInput" placeholder="Поиск по категории, комментарию, автору" value="' + txQuery + '">' +
    '<div class="tx-filter-row" id="txTypeRow">' +
    '<button class="tx-chip' + (txTypeFilter === 'all' ? ' active' : '') + '" data-type="all">Все</button>' +
    '<button class="tx-chip' + (txTypeFilter === 'expense' ? ' active' : '') + '" data-type="expense">Расходы</button>' +
    '<button class="tx-chip' + (txTypeFilter === 'income' ? ' active' : '') + '" data-type="income">Доходы</button>' +

    '<div id="modalTxList"></div>' +

  document.getElementById('txSearchInput').addEventListener('input', function (e) {
    txQuery = e.target.value;
    renderTxListFiltered();
  });
  document.getElementById('txTypeRow').addEventListener('click', function (e) {

    renderTxModal(body);
  });

    if (!btn) return;
    txAccountFilter = btn.dataset.acc;
    renderTxModal(body);
  });

  renderTxListFiltered();

function renderTxListFiltered() {
  const list = filteredTxList();
  renderTxList('modalTxList', list);
  const btn = document.getElementById('txLoadMoreBtn');
  if (btn) btn.style.display = txHasMore ? 'block' : 'none';
}

async function loadMoreTx() {
  const btn = document.getElementById('txLoadMoreBtn');
  const combined = combinedTxList();
  if (!combined.length) { txHasMore = false; if (btn) btn.style.display = 'none'; return; }
  const oldest = combined.reduce(function (min, t) { return t.created_at < min ? t.created_at : min; }, combined[0].created_at);
  if (btn) { btn.disabled = true; btn.textContent = 'Загрузка…'; }
  try {
    const range = getPeriodRange();
    let qs = 'init_data=' + encodeURIComponent(initData) + '&limit=200&end=' + (oldest - 1);
    if (range.start != null) qs += '&start=' + range.start;
    const more = await api('/api/transactions?' + qs);
    if (!more.length) { txHasMore = false; }
    else { txModalExtra = txModalExtra.concat(more); if (more.length < 200) txHasMore = false; }
    renderTxListFiltered();
  } catch (e) {
    console.error(e);
    showToast('Не удалось загрузить дополнительные операции');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Загрузить ещё'; }
  }
}

function confirmDelete(id) {
  if (deletingIds.has(id)) return;
  tg.showConfirm('Удалить эту операцию?', function (ok) {
    if (!ok) return;
    deletingIds.add(id);
    api('/api/transactions', {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, id: id }),
    }).then(function () {
      tg.HapticFeedback.notificationOccurred('success');
      return loadData();
    }).catch(function () {
      tg.showAlert('Не удалось удалить операцию. Попробуйте ещё раз.');
    }).finally(function () {
      deletingIds.delete(id);
    });
  });
}

    '<div style="font-size:10.5px; color:var(--hint);"><span style="color:#5be08a;">●</span> доход &nbsp; <span style="color:#ff6b81;">●</span> расход</div></div>' +
    '<div id="monthlyTrendChart"><div class="empty">Загрузка…</div></div>' +
    '<div style="height:1px; background:rgba(255,255,255,0.08); margin:16px 0;"></div>' +
    '<div style="font-size:13px; font-weight:700; margin-bottom:10px;" id="weeklyTitle">По неделям</div>' +
    '<div id="weeklyTrendChart"><div class="empty">Загрузка…</div></div>';

  const svg = document.getElementById('modalDonut');
  const entries = Object.entries(lastSummary.by_category).sort(function (a, b) { return b[1] - a[1]; });
  const r = 44, cx = 54, cy = 54, circumference = 2 * Math.PI * r;
  let offset = 0, paths = '';
  if (entries.length === 0 || !total) {
    paths = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>';
  } else {
    entries.forEach(function (entry, i) {
      const len = (entry[1] / total) * circumference;
      paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + COLORS[i % COLORS.length] + '" ' +
        'stroke-width="14" stroke-dasharray="' + len + ' ' + (circumference - len) + '" ' +
        'stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
      offset += len;
    });
  }
  svg.innerHTML = paths +

  renderLegend(document.getElementById('modalCatLegend'), Object.fromEntries(entries), total || 0);

  const weekRefYear = periodAll ? now.getFullYear() : periodYear;
  const weekRefMonth = periodAll ? now.getMonth() : periodMonth;
  document.getElementById('weeklyTitle').textContent = 'По неделям — ' + MONTH_NAMES[weekRefMonth] + ' ' + weekRefYear;

    if (el) renderBarChart(el, buckets);
  }).catch(function (e) { console.error(e); });

  fetchWeeklyBreakdown(weekRefYear, weekRefMonth).then(function (buckets) {
    const el = document.getElementById('weeklyTrendChart');
    if (el) renderBarChart(el, buckets);
  }).catch(function (e) { console.error(e); });
}

function toDatetimeLocalValue(ts) {
  const d = new Date(ts * 1000);
  const pad = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function fromDatetimeLocalValue(str) {
  if (!str) return Math.floor(Date.now() / 1000);
  const d = new Date(str);
  return Math.floor(d.getTime() / 1000);
}

async function submitTx() {
  if (isSubmitting) return;
  const amount = parseFloat(document.getElementById('amountInput').value);
  if (!amount || amount <= 0) { tg.showAlert('Введите сумму'); return; }
  const category = selectedCategory || 'Прочее';
  const account = selectedAccount || 'Наличные';
  const comment = document.getElementById('commentInput').value;
  const createdAt = fromDatetimeLocalValue(document.getElementById('dtInput').value);

  isSubmitting = true;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = editingId ? 'Сохраняем…' : 'Добавляем…';

  try {
    if (editingId) {
      await api('/api/transactions', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: initData, id: editingId, amount: amount, type: currentType, category: category, account: account, comment: comment, created_at: createdAt })
      });
    } else {
      await api('/api/transactions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: initData, amount: amount, type: currentType, category: category, account: account, comment: comment, created_at: createdAt })
      });
    }
    closeSheet();
    tg.HapticFeedback.notificationOccurred('success');
    await loadData();
  } catch (e) {
    tg.showAlert('Не получилось сохранить операцию');
  } finally {
    isSubmitting = false;
    btn.disabled = false;
    btn.textContent = editingId ? 'Сохранить' : 'Добавить';
  }
}

  const list = tab === 'expense' ? expenseCategories : incomeCategories;
  const item = editing ? list[editing.index] : null;
  document.getElementById('promptTitle').textContent = editing ? 'Изменить категорию' : 'Новая категория';
  document.getElementById('promptBody').innerHTML =
    '<div class="icon-input-row">' +
    '<input type="text" id="promptIcon" maxlength="4" value="' + (item ? item.icon : '🏷️') + '">' +

    '</div>' +

    (item && !item.system ? '<button class="submit-btn" style="background:rgba(255,107,129,0.14); color:#ff6b81; margin-top:8px;" onclick="deletePromptCategory()">Удалить категорию</button>' : '');
  openPrompt();
}
function savePromptCategory() {
  const tab = promptEditingIndex ? promptEditingIndex.type : (window.__catTab || 'expense');
  const list = tab === 'expense' ? expenseCategories : incomeCategories;
  const icon = document.getElementById('promptIcon').value.trim() || '🏷️';
  const name = document.getElementById('promptName').value.trim();
  if (!name) { tg.showAlert('Введите название категории'); return; }
  if (promptEditingIndex) {
    list[promptEditingIndex.index].name = name;
    list[promptEditingIndex.index].icon = icon;
  } else {
    if (list.length >= CATEGORY_LIMIT) { tg.showAlert('Достигнут лимит категорий (' + CATEGORY_LIMIT + ')'); return; }
    const systemIdx = list.findIndex(function (c) { return c.system; });
    const newItem = { name: name, icon: icon, system: false };
    if (systemIdx >= 0) list.splice(systemIdx, 0, newItem); else list.push(newItem);
  }
  persistCategories(tab);
  closePrompt();
  renderCatTab(tab);
  tg.HapticFeedback.notificationOccurred('success');
}
function deletePromptCategory() {
  const tab = promptEditingIndex.type;
  const list = tab === 'expense' ? expenseCategories : incomeCategories;
  const catName = list[promptEditingIndex.index].name;
  countCategoryUsage(catName).then(function (count) {
    const msg = count > 0
      ? 'У категории «' + catName + '» уже есть ' + count + ' ' + pluralOps(count) + '. Они останутся в истории с этим названием, но выбрать эту категорию для новых операций будет нельзя. Удалить категорию?'
      : 'Удалить эту категорию?';
    tg.showConfirm(msg, function (ok) {
      if (!ok) return;
      list.splice(promptEditingIndex.index, 1);
      persistCategories(tab);
      closePrompt();
      renderCatTab(tab);
    });
  });
}
function pluralOps(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return 'операция';
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return 'операции';
  return 'операций';
}
async function countCategoryUsage(catName) {
  try {
    const txs = await api('/api/transactions?init_data=' + encodeURIComponent(initData) + '&limit=3000');
    return txs.filter(function (t) { return t.category === catName; }).length;
  } catch (e) { return 0; }
}
function persistCategories(tab) {
  if (tab === 'expense') { saveJSON('walletExpenseCategories', expenseCategories); syncCategoriesList(); }
  else { saveJSON('walletIncomeCategories', incomeCategories); }
}

/* ===== Бюджеты ===== */
async function fetchCurrentMonthByCategory() {
  const now2 = new Date();
  const start = Math.floor(new Date(now2.getFullYear(), now2.getMonth(), 1).getTime() / 1000);
  const end = Math.floor(new Date(now2.getFullYear(), now2.getMonth() + 1, 0, 23, 59, 59).getTime() / 1000);
  try {
    const txs = await api('/api/transactions?init_data=' + encodeURIComponent(initData) + '&limit=3000&start=' + start + '&end=' + end);
    const byCat = {};
    txs.forEach(function (t) {
      if (t.type !== 'expense') return;
      byCat[t.category] = (byCat[t.category] || 0) + Number(t.amount);
    });
    return byCat;
  } catch (e) { return {}; }
}
function renderBudgetsModal(body) {

  fetchCurrentMonthByCategory().then(function (byCat) {
    const listEl = document.getElementById('budgetList');
    listEl.innerHTML = '';
    expenseCategories.forEach(function (c) {
      const limit = budgets[c.name];
      const spent = byCat[c.name] || 0;

        '</div>' +
        (limit ? '<div class="budget-bar"><div class="budget-bar-fill' + (spent > limit ? ' over' : '') + '" style="width:' + pct + '%"></div></div>' : '');
      row.onclick = function () { openBudgetPrompt(c.name, limit); };

function copyShortcutKey() {
  const done = function () { tg.HapticFeedback.notificationOccurred('success'); tg.showAlert('Ключ скопирован'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(shortcutKey).then(done).catch(function () { fallbackCopy(shortcutKey); done(); });
  } else { fallbackCopy(shortcutKey); done(); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) { console.error(e); }
  document.body.removeChild(ta);
}

  { emoji: '💜', title: 'Баланс и период', desc: 'Наверху выбирай месяц или «Всё время», а карточка ниже показывает общий баланс за выбранный период.' },
  { emoji: '➕', title: 'Добавляй операции', desc: 'Кнопка «Добавить» или большая круглая кнопка снизу открывают форму — выбери тип, категорию, место хранения и сумму.' },
  { emoji: '📊', title: 'Категории и бюджеты', desc: 'В меню (значок ☰ вверху слева) можно настраивать категории, ставить месячные лимиты в «Бюджетах» и включать быстрый ввод без открытия чата.' },
  { emoji: '⚙️', title: 'Настройки — под тебя', desc: 'Тема, часовой пояс и напоминания находятся в разделе «Настройки» в том же меню. Готово — можно начинать!' }
];
let onboardIndex = 0;
function startOnboarding() {
  onboardIndex = 0;
  renderOnboardStep();
  document.getElementById('onboardOverlay').classList.add('open');
}
function renderOnboardStep() {
  const step = ONBOARD_STEPS[onboardIndex];
  document.getElementById('onboardBody').innerHTML =
    '<div class="onboard-illustration"><div class="emoji">' + step.emoji + '</div></div>' +
    '<div class="onboard-title">' + step.title + '</div>' +
    '<div class="onboard-desc">' + step.desc + '</div>';
  const dots = document.getElementById('onboardDots');
  dots.innerHTML = '';
  ONBOARD_STEPS.forEach(function (s, i) {
    const d = document.createElement('div');
    d.className = 'onboard-dot' + (i === onboardIndex ? ' active' : '');
    dots.appendChild(d);
  });
  document.getElementById('onboardBackBtn').style.visibility = onboardIndex === 0 ? 'hidden' : 'visible';
  document.getElementById('onboardNextBtn').textContent = onboardIndex === ONBOARD_STEPS.length - 1 ? 'Готово' : 'Далее';
}
function onboardStep(delta) {
  if (delta > 0 && onboardIndex === ONBOARD_STEPS.length - 1) { finishOnboarding(); return; }
  onboardIndex = Math.max(0, Math.min(ONBOARD_STEPS.length - 1, onboardIndex + delta));
  renderOnboardStep();
}
function finishOnboarding() {
  document.getElementById('onboardOverlay').classList.remove('open');
  localStorage.setItem('walletOnboardingSeen', '1');
}

/* ===== Перевод между счетами ===== */
let transferFrom = null, transferTo = null;
function openTransferSheet() {
  if (accounts.length < 2) { tg.showAlert('Для перевода нужно как минимум два счёта. Добавьте ещё один счёт в разделе «Счета».'); return; }
  document.getElementById('transferAmount').value = '';
  document.getElementById('transferComment').value = '';
  transferFrom = accountsList[0];
  transferTo = accountsList[1];
  renderTransferChips();
  document.getElementById('transferOverlay').classList.add('open');
}
function renderTransferChips() {
  const fromEl = document.getElementById('transferFromButtons');
  const toEl = document.getElementById('transferToButtons');
  fromEl.innerHTML = ''; toEl.innerHTML = '';
  accountsList.forEach(function (a) {
    const fBtn = document.createElement('div');
    fBtn.className = 'chip-btn' + (a === transferFrom ? ' selected' : '');
    fBtn.textContent = accIcon(a) + ' ' + a;
    fBtn.onclick = function () { transferFrom = a; renderTransferChips(); };
    fromEl.appendChild(fBtn);

    const tBtn = document.createElement('div');
    tBtn.className = 'chip-btn' + (a === transferTo ? ' selected' : '');
    tBtn.textContent = accIcon(a) + ' ' + a;
    tBtn.onclick = function () { transferTo = a; renderTransferChips(); };
    toEl.appendChild(tBtn);
  });
}
function closeTransferSheet() { document.getElementById('transferOverlay').classList.remove('open'); }
function closeOnTransferOverlay(e) { if (e.target.id === 'transferOverlay') closeTransferSheet(); }
async function submitTransfer() {
  const amount = parseFloat(document.getElementById('transferAmount').value);
  if (!amount || amount <= 0) { tg.showAlert('Введите сумму перевода'); return; }
  if (!transferFrom || !transferTo || transferFrom === transferTo) { tg.showAlert('Выберите два разных счёта'); return; }
  const comment = document.getElementById('transferComment').value;
  const btn = document.getElementById('transferSubmitBtn');
  btn.disabled = true; btn.textContent = 'Переводим…';
  const now4 = Math.floor(Date.now() / 1000);
  try {
    await api('/api/transactions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, amount: amount, type: 'expense', category: 'Перевод', account: transferFrom, comment: 'Перевод на «' + transferTo + '»' + (comment ? ' · ' + comment : ''), created_at: now4 })
    });
    await api('/api/transactions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, amount: amount, type: 'income', category: 'Перевод', account: transferTo, comment: 'Перевод с «' + transferFrom + '»' + (comment ? ' · ' + comment : ''), created_at: now4 })
    });
    closeTransferSheet();
    tg.HapticFeedback.notificationOccurred('success');
    await loadData();
  } catch (e) {
    console.error(e);
    tg.showAlert('Не получилось выполнить перевод');
  } finally {
    btn.disabled = false; btn.textContent = 'Перевести';
  }
}

/* ===== Вход по коду партнёра ===== */
function openJoinPrompt() {
  promptMode = 'join';
  document.getElementById('promptTitle').textContent = 'Код партнёра';
  document.getElementById('promptBody').innerHTML =
    '<label>Код приглашения</label>' +
    '<input type="text" id="promptJoinCode" placeholder="Например: AB12CD">' +
    '<button class="submit-btn" onclick="submitJoinCode()">Присоединиться</button>' +
    '<div class="card-hint">Можно ввести код здесь или отправить боту команду /link ' + '&lt;код&gt;' + ' в чате.</div>';
  openPrompt();
}
async function submitJoinCode() {
  const code = document.getElementById('promptJoinCode').value.trim();
  if (!code) { tg.showAlert('Введите код'); return; }
  try {
    const resp = await api('/api/link', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: initData, code: code })
    });
    closePrompt();
    tg.HapticFeedback.notificationOccurred('success');
    tg.showAlert(resp.message || 'Готово!');
    await loadData();
  } catch (e) {
    console.error(e);
    tg.showAlert('Не получилось присоединиться по коду. Попробуйте команду /link ' + code + ' в чате с ботом.');
  }
}

/* ===== Скан чека ===== */
function triggerReceiptPicker() { document.getElementById('receiptFileInput').click(); }
function handleReceiptFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function () {
    const base64 = reader.result.split(',')[1];
    await processReceiptImage(base64, file.type || 'image/jpeg');
  };
  reader.readAsDataURL(file);
}
let receiptItems = [];
let receiptNeedsReview = false;
let receiptDetectedTotal = null;
let receiptDetectedCurrency = null;
async function processReceiptImage(base64, mediaType) {
  promptMode = 'receipt';
  document.getElementById('promptTitle').textContent = 'Скан чека';
  document.getElementById('promptBody').innerHTML = '<div class="empty">Читаю чек…</div>';
  openPrompt();
  try {
    const result = await api('/api/receipt', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        init_data: initData, image: base64, media_type: mediaType,
        categories: { expense: expenseCategories.map(function (c) { return c.name; }) }
      })
    });
    const items = result.items || [];
    if (!items.length) {
      document.getElementById('promptBody').innerHTML = '<div class="empty">Не получилось распознать чек. Попробуйте более чёткое фото.</div>';
      return;
    }
    receiptItems = items.map(function (it) { return { category: it.category || 'Прочее', amount: Number(it.amount) || 0, comment: it.comment || '' }; });
    receiptNeedsReview = !!result.needsReview;
    receiptDetectedTotal = result.total;
    receiptDetectedCurrency = result.currency || null;
    renderReceiptReview();
  } catch (e) {
    console.error(e);
    document.getElementById('promptBody').innerHTML = '<div class="empty">Ошибка распознавания: ' + (e.message || 'попробуйте ещё раз') + '</div>';
  }
}
function renderReceiptReview() {
  const catNames = expenseCategories.map(function (c) { return c.name; });
  const body = document.getElementById('promptBody');
  body.innerHTML = '';
  if (receiptDetectedCurrency && receiptDetectedCurrency !== 'UAH') {
    const cwarn = document.createElement('div');
    cwarn.className = 'card-hint';
    cwarn.style.cssText = 'background:rgba(96,165,250,0.14); color:#93c5fd; padding:10px 12px; border-radius:12px; margin-bottom:12px;';
    cwarn.textContent = '💱 Похоже, чек в валюте ' + receiptDetectedCurrency + ', а не ₴. Суммы ниже — как на чеке, без конвертации. При необходимости пересчитайте вручную.';
    body.appendChild(cwarn);
  }
  if (receiptNeedsReview) {
    const warn = document.createElement('div');
    warn.className = 'card-hint';
    warn.style.cssText = 'background:rgba(255,107,129,0.14); color:#ffb3c0; padding:10px 12px; border-radius:12px; margin-bottom:12px;';
    warn.textContent = '⚠️ Сумма позиций не совпадает с итогом чека' +
      (receiptDetectedTotal != null ? ' (на чеке: ' + fmt(receiptDetectedTotal) + ' ' + (receiptDetectedCurrency || '₴') + ')' : '') +
      ' — внимательно проверьте цифры перед сохранением.';
    body.appendChild(warn);
  }
  receiptItems.forEach(function (item, i) {
    const row = document.createElement('div');
    row.className = 'receipt-item';
    const options = catNames.map(function (name) {
      return '<option value="' + name + '"' + (name === item.category ? ' selected' : '') + '>' + name + '</option>';
    }).join('');
    row.innerHTML =
      '<div class="receipt-item-top">' +
      '<select data-i="' + i + '" class="r-cat">' + options + '</select>' +
      '<input type="number" inputmode="decimal" data-i="' + i + '" class="r-amount" value="' + item.amount + '">' +
      '<button class="r-remove" data-i="' + i + '">✕</button>' +
      '</div>' +
      '<div class="r-comment">' + (item.comment || '') + '</div>';
    body.appendChild(row);
  });
  const total = receiptItems.reduce(function (s, it) { return s + it.amount; }, 0);
  const footer = document.createElement('div');
  footer.innerHTML =
    '<div class="card-hint" style="margin:8px 0 14px;">Итого: ' + fmt(total) + ' ₴ · проверьте категории и суммы перед сохранением</div>' +
    '<button class="submit-btn" onclick="saveAllReceiptItems()">Сохранить все (' + receiptItems.length + ')</button>';
  body.appendChild(footer);

  body.querySelectorAll('.r-cat').forEach(function (sel) {
    sel.onchange = function () { receiptItems[Number(sel.dataset.i)].category = sel.value; };
  });
  body.querySelectorAll('.r-amount').forEach(function (inp) {
    inp.onchange = function () { receiptItems[Number(inp.dataset.i)].amount = Number(inp.value) || 0; renderReceiptReview(); };
  });
  body.querySelectorAll('.r-remove').forEach(function (btn) {
    btn.onclick = function () { receiptItems.splice(Number(btn.dataset.i), 1); renderReceiptReview(); };
  });
}
async function saveAllReceiptItems() {
  if (!receiptItems.length) { closePrompt(); return; }
  const now5 = Math.floor(Date.now() / 1000);
  try {
    for (const item of receiptItems) {
      if (!item.amount) continue;
      await api('/api/transactions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: initData, amount: item.amount, type: 'expense', category: item.category, account: 'Наличные', comment: item.comment, created_at: now5 })
      });
    }
    closePrompt();
    tg.HapticFeedback.notificationOccurred('success');
    await loadData();
  } catch (e) {
    console.error(e);
    showToast('Не всё удалось сохранить, проверьте список операций');
  }
}

/* ===== Экспорт операций в CSV ===== */
async function exportTransactionsCSV() {
  const btn = document.getElementById('exportCsvBtn');
  const origText = btn.innerHTML;
  btn.innerHTML = '<div class="lr-name">Собираю операции…</div>';
  try {
    const all = await api('/api/transactions?init_data=' + encodeURIComponent(initData) + '&limit=5000');
    if (!all.length) { tg.showAlert('Пока нет ни одной операции для экспорта.'); return; }

    const header = ['Дата', 'Время', 'Тип', 'Категория', 'Счёт', 'Сумма', 'Комментарий', 'Кто добавил'];
    const escCsv = function (v) {
      const s = String(v == null ? '' : v);
      return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const rows = all.map(function (t) {
      const d = new Date(t.created_at * 1000);
      const dateStr = d.toLocaleDateString('ru-RU');
      const timeStr = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const typeStr = t.type === 'expense' ? 'Расход' : 'Доход';
      const who = t.first_name || t.username || '';
      return [dateStr, timeStr, typeStr, t.category, t.account || 'Наличные', t.amount, t.comment || '', who].map(escCsv).join(';');
    });
    const csv = '\uFEFF' + header.join(';') + '\n' + rows.join('\n'); // BOM — чтобы Excel корректно показал кириллицу

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'wallet-operations-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    tg.HapticFeedback.notificationOccurred('success');
  } catch (e) {
    console.error(e);
    showToast('Не удалось выгрузить операции');
  } finally {
    btn.innerHTML = origText;
  }
}

updatePeriodLabel();
waitForInitData(2000).then(function () { loadData(); });
